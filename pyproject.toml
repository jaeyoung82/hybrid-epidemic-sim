[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-epidemic-sim"
version = "1.0.0"
description = "Hybrid epidemic simulation with event modeling and survival analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "geopandas>=0.11",
     "pydantic>=2.0",
     "typer>=0.9",
    "lifelines>=0.27",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
hybrid-sim = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_simulation*", "code_config_models*", "code_survival*", "code_plotting*"]

[tool.setuptools]
py-modules = ["cli", "run_hybrid_simulation", "run_arrival_heatmap", "run_sim_visualization", "run_survival_analysis", "simulation_orchestrator"]